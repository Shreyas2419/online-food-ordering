<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Faura Icon">
  <defs>
    <linearGradient id="iconSaffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="45%" stop-color="#E36414"/>
      <stop offset="100%" stop-color="#B83A0E"/>
    </linearGradient>
    <linearGradient id="iconGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="35%" stop-color="#E5B23C"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B1C"/>
    </linearGradient>
    <radialGradient id="iconAuraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(227, 100, 20, 0.4)"/>
      <stop offset="60%" stop-color="rgba(212, 175, 55, 0.2)"/>
      <stop offset="100%" stop-color="rgba(227, 100, 20, 0)"/>
    </radialGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#8B1E0F" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="80" height="80" rx="18" fill="#FFFDF9"/>
  <rect width="78" height="78" x="1" y="1" rx="17" fill="none" stroke="url(#iconGoldGrad)" stroke-width="1.5" opacity="0.6"/>
  <circle cx="40" cy="40" r="32" fill="url(#iconAuraGlow)"/>

  <g filter="url(#iconShadow)">
    <!-- Base Plate -->
    <ellipse cx="40" cy="58" rx="24" ry="5.5" fill="url(#iconGoldGrad)"/>
    <ellipse cx="40" cy="58" rx="18" ry="3.2" fill="#8B1E0F"/>

    <!-- Sacred Diya / Cloche Dome Outer Lotus Petals -->
    <path d="M 22 55 C 22 36, 32 25, 40 22 C 48 25, 58 36, 58 55 Z" fill="url(#iconSaffronGrad)"/>

    <!-- Inner Golden Arch Petals -->
    <path d="M 27 55 C 27 41, 34 32, 40 28 C 46 32, 53 41, 53 55 Z" fill="url(#iconGoldGrad)"/>

    <!-- Center Flavour Flame / Spice Drop -->
    <path d="M 40 14 C 36 19, 35 23, 37 28 C 39 31, 41 31, 43 28 C 45 23, 44 19, 40 14 Z" fill="url(#iconGoldGrad)"/>
    <circle cx="40" cy="25" r="2.2" fill="#FFF3C4"/>

    <!-- Flares -->
    <path d="M 19 49 C 15 45, 16 40, 18 37 C 21 40, 22 44, 22 49 Z" fill="url(#iconGoldGrad)"/>
    <path d="M 61 49 C 65 45, 64 40, 62 37 C 59 40, 58 44, 58 49 Z" fill="url(#iconGoldGrad)"/>

    <circle cx="31" cy="58" r="1.5" fill="#FFF3C4"/>
    <circle cx="40" cy="59" r="1.8" fill="#FFF3C4"/>
    <circle cx="49" cy="58" r="1.5" fill="#FFF3C4"/>
  </g>
</svg>
